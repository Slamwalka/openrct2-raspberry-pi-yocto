[general]
rct1_path = "/usr/share/rct-game-data/RCT"
game_path = "/usr/share/rct-game-data/RCT2"
fullscreen_mode = 2
fullscreen_width = -1
fullscreen_height = -1
window_width = 800
window_height = 480
window_scale = 1.000000
display_rotation = 0
edge_scrolling = true
use_vsync = true
spectator_auto_tour = true
spectator_auto_tour_min_interval = 18
spectator_auto_tour_max_interval = 42
spectator_auto_tour_idle_seconds = 30

[network]
default_password = ""
known_keys_only = false
advertise = true
pause_server_if_only_spectators = true
server_name = "{OUTLINE}{TOPAZ}RPI {YELLOW}OPENRCT2 {BABYBLUE}PARK"
server_description = "Raspberry Pi 4 | OpenRCT2 Community"